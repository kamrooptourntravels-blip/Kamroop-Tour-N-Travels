<style>

.contact-page{
margin-top:100px;
padding:60px 8%;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.contact-box,
.form-box{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.contact-box h2,
.form-box h2{
color:#003366;
margin-bottom:20px;
}

.contact-box p{
margin:15px 0;
font-size:18px;
}

.contact-box i{
color:#FFD700;
margin-right:10px;
}

.form-box input,
.form-box textarea{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

.form-box textarea{
height:140px;
resize:none;
}

.send-btn{
background:#003366;
color:#fff;
border:none;
padding:14px;
width:100%;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.send-btn:hover{
background:#FFD700;
color:#003366;
}

.map{
padding:50px 8%;
}

iframe{
width:100%;
height:400px;
border:none;
border-radius:15px;
}

@media(max-width:768px){
.contact-page{
grid-template-columns:1fr;
}
}

</style>

</head>
